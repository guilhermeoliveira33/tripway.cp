<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TripWay - Contato</title>
</head>
<body>

    <header>
        <h1>TripWay</h1>
        <nav>
            <ul>
                <li><a href="../index.html">Home</a></li>
                <li><a href="destinos.html">Destinos</a></li>
                <li><a href="pacotes.html">Pacotes ou Serviços</a></li>
                <li><a href="contato.html">Contato</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section>
            <h2>Entre em Contato / Faça a sua Reserva</h2>
            <form action="#" method="post">
                <label for="email">E-mail:</label><br>
                <input type="email" id="email" name="email" required><br><br>

                <label for="destino">Destino de Interesse:</label><br>
                <select id="destino" name="destino">
                    <option value="praia">Praia Paradisíaca</option>
                    <option value="montanha">Montanhas Nevadas</option>
                    <option value="cidade">Cidades Históricas</option>
                </select><br><br>

                <label for="data">Data de Viagem:</label><br>
                <input type="date" id="data" name="data" required><br><br>

                <label for="quantidade">Quantidade de Pessoas:</label><br>
                <input type="number" id="quantidade" name="quantidade" min="1" required><br><br>

                <label for="mensagem">Mensagem:</label><br>
                <textarea id="mensagem" name="mensagem" rows="5" required></textarea><br><br>

                <button type="submit">Enviar</button>
            </form>
            <br>
            <img src="../images/contato-img.jpg" alt="Atendimento ao cliente e suporte ao viajante" width="700" height="465">
        </section>
    </main>

    <footer>
        <p>&copy; 2026 TripWay - Todos os direitos reservados.</p>
    </footer>

</body>
</html>
